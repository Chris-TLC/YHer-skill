# YHer AI chemistry assistant - config template

llm:
  # Pick one: deepseek / kimi / tongyi / zhipu / doubao / minimax / anthropic / openai
  provider: deepseek

  # Model name (see PROVIDER_CONFIGS in adapters/llm_client.py)
  model: deepseek-v4-pro

  # API key read from the environment (recommended)
  api_key_env: DEEPSEEK_API_KEY

  # Advanced settings
  max_tokens: 2000
  temperature: 0.3
  enable_caching: true

memory:
  # Full memory always-on (user decision v3)
  enabled: true
  user_id: chris_2026

  # Supabase config (read from environment)
  supabase_url_env: SUPABASE_URL
  supabase_key_env: SUPABASE_KEY

  # Quarterly high-fidelity compression (v3 key)
  compression:
    enabled: true
    threshold_days: 90              # quarterly (90 days), not monthly
    max_summary_tokens: 4000        # high fidelity (4000), not 500
    auto_run_on_startup: true

  # Cost alert
  cost_alert:
    monthly_budget: 30
    alert_at_pct: 80

retrieve:
  embeddings_dir: data/embeddings/
  top_k_chunks: 8
  top_k_nodes: 3
  top_k_patterns: 2

format:
  max_response_length: 1500
  opening_max_chars: 15
  closing_max_chars: 20
