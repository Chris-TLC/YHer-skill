[pytest]
testpaths = tests
norecursedirs = data .* _backup* *backup_pre* node_modules
addopts = --strict-markers -m "not paid"
markers =
    paid: requires a live provider, incurs cost, performs network I/O, or writes a remote store
    paper: requires the internal paper archive (docs/paper + /tmp generator), excluded from the public repo
# 19 个 paper 产物类测试(依赖已出仓的 docs/paper)不在公开仓运行;要全量验证:
#   PYTHONDONTWRITEBYTECODE=1 .venv-pub/bin/python -B -m pytest -q --timeout=120 --override-ini="addopts="
