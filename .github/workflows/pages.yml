name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy report PDF into pages directory
        run: |
          mkdir -p docs/pages/paper
          cp docs/paper/YHer_Engineering_Evidence_Report.pdf docs/pages/paper/
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
